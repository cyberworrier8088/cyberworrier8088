<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7a5c22"/>
      <stop offset="0.5" stop-color="#f5d78e"/>
      <stop offset="1" stop-color="#7a5c22"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- each command owns a 4s slot of a 12s loop: type 1.2s, hold, erase -->
    <clipPath id="c1"><rect x="188" y="128" height="32" width="0">
      <animate attributeName="width" values="0;209;209;0;0" keyTimes="0;0.1;0.2833;0.3167;1" dur="12s" begin="0.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="188" y="128" height="32" width="0">
      <animate attributeName="width" values="0;231;231;0;0" keyTimes="0;0.1;0.2833;0.3167;1" dur="12s" begin="4.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="188" y="128" height="32" width="0">
      <animate attributeName="width" values="0;220;220;0;0" keyTimes="0;0.1;0.2833;0.3167;1" dur="12s" begin="8.6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1000" height="240" rx="14" fill="#0b0a08"/>
  <rect x="1" y="1" width="998" height="238" rx="13" fill="none" stroke="#d4af37" stroke-opacity="0.25"/>

  <text x="56" y="92" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="700" letter-spacing="4" fill="url(#gold)">CYBERWORRIER8088</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="20">
    <text x="56" y="152" fill="#7a5c22">imu@lion:~$</text>
    <text x="188" y="152" fill="#f5d78e" clip-path="url(#c1)">cargo run --release</text>
    <text x="188" y="152" fill="#f5d78e" clip-path="url(#c2)">./dragon-ide --open .</text>
    <text x="188" y="152" fill="#f5d78e" clip-path="url(#c3)">echo "never give up"</text>
    <text x="56" y="190" fill="#a8916a" opacity="0">&gt; 15 y/o · rust · tauri · linux
      <animate attributeName="opacity" to="1" begin="1.4s" dur="0.8s" fill="freeze"/>
    </text>
  </g>

  <g fill="#f5d78e">
    <animate attributeName="fill-opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    <rect y="136" width="11" height="20" x="188" opacity="0">
      <animate attributeName="x" values="188;397;397;188;188" keyTimes="0;0.1;0.2833;0.3167;1" dur="12s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="12s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect y="136" width="11" height="20" x="188" opacity="0">
      <animate attributeName="x" values="188;419;419;188;188" keyTimes="0;0.1;0.2833;0.3167;1" dur="12s" begin="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="12s" begin="4.6s" repeatCount="indefinite"/>
    </rect>
    <rect y="136" width="11" height="20" x="188" opacity="0">
      <animate attributeName="x" values="188;408;408;188;188" keyTimes="0;0.1;0.2833;0.3167;1" dur="12s" begin="8.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="12s" begin="8.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- claw marks: scratch in once, then breathe -->
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="3s" begin="1s" repeatCount="indefinite"/>
    <path d="M820 40 Q850 120 836 200" stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" to="0" begin="0.2s" dur="0.35s" fill="freeze"/>
    </path>
    <path d="M868 30 Q898 115 884 206" stroke-dasharray="190" stroke-dashoffset="190">
      <animate attributeName="stroke-dashoffset" to="0" begin="0.32s" dur="0.35s" fill="freeze"/>
    </path>
    <path d="M916 44 Q944 120 930 196" stroke-dasharray="170" stroke-dashoffset="170">
      <animate attributeName="stroke-dashoffset" to="0" begin="0.44s" dur="0.35s" fill="freeze"/>
    </path>
  </g>
</svg>
